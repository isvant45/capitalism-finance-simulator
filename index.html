<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capitalism Finance Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e7edf6;font:16px system-ui}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:26px}small{color:#a4b5c9}button,select,input{font:inherit;border:1px solid #40536b;border-radius:8px;padding:10px;background:#22344a;color:white}button{cursor:pointer}button:hover{background:#31516c}.primary{background:#087d69}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,section{background:#192638;border:1px solid #30425a;border-radius:14px;padding:18px;margin-bottom:14px}.metric{font-size:26px;font-weight:bold;color:#80e5c5}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #35455b}input{width:120px}#notice{color:#ffd17d;min-height:24px}.scroll{overflow:auto}</style><header><div><small>SIMULADOR ECONÓMICO · HONDURAS</small><h1>Capitalism Finance Simulator</h1></div><button class="primary" onclick="turn()">Avanzar un mes →</button></header><main><div class="grid" id="metrics"></div><div id="notice" role="status"></div><nav id="nav"></nav><section id="panel"></section><section><h3>Historial financiero</h3><canvas id="chart" width="900" height="160" style="width:100%"></canvas><div id="log"></div></section><button onclick="if(confirm('¿Reiniciar partida?')){localStorage.removeItem('cfs1');location.reload()}">Nueva partida</button></main><script>
const sectors=[{n:'Supermercado',cost:85000,rev:15500,expense:9700},{n:'Fábrica industrial',cost:180000,rev:38000,expense:23800},{n:'Inmobiliaria',cost:250000,rev:28000,expense:11000},{n:'Banco comercial',cost:350000,rev:48000,expense:29000}];let s;try{s=JSON.parse(localStorage.getItem('cfs1'))}catch{}if(!s)s={month:1,cash:500000,debt:0,deposit:0,companies:[],stocks:[0,0,0],prices:[100,180,250],inflation:4,rate:12,history:[500000],log:['Capital inicial: L 500,000'],last:0};let tab='Empresas';const names=['Industria Norte','Comercio Global','Finanzas Unidas'];const money=n=>'L '+Math.round(n).toLocaleString('es-HN');const val=id=>Number(document.getElementById(id).value);const total=()=>s.cash+s.deposit+s.companies.reduce((a,c)=>a+sectors[c.type].cost*.85*c.level,0)+s.stocks.reduce((a,q,i)=>a+q*s.prices[i],0)-s.debt;function note(t){document.getElementById('notice').textContent=t}function commit(t){s.log.unshift('Mes '+s.month+' · '+t);s.log=s.log.slice(0,40);render();note(t)}function amount(id){let n=val(id);return Number.isFinite(n)&&n>0?n:0}function buy(i){let c=sectors[i];if(s.cash<c.cost)return note('Capital insuficiente');s.cash-=c.cost;s.companies.push({type:i,level:1});commit('Empresa adquirida: '+c.n)}function upgrade(i){let c=s.companies[i],cost=sectors[c.type].cost;if(s.cash<cost)return note('Capital insuficiente');s.cash-=cost;c.level++;commit('Capacidad ampliada')}function sell(i){let c=s.companies[i];s.cash+=sectors[c.type].cost*.85*c.level;s.companies.splice(i,1);commit('Empresa vendida')}function bank(op){let n=amount('amt');if(!n)return note('Ingresa un monto positivo');if(op==='loan'){if(s.debt+n>Math.max(100000,total()*.7))return note('Límite crediticio excedido');s.debt+=n;s.cash+=n}else if(op==='pay'){n=Math.min(n,s.debt);if(!n||s.cash<n)return note('Saldo insuficiente');s.cash-=n;s.debt-=n}else if(op==='deposit'){if(s.cash<n)return note('Saldo insuficiente');s.cash-=n;s.deposit+=n}else{if(s.deposit<n)return note('Depósito insuficiente');s.deposit-=n;s.cash+=n}commit('Operación bancaria: '+money(n))}function stock(i,dir){let q=amount('q'+i);if(!Number.isInteger(q)||!q)return note('Cantidad entera positiva requerida');let cost=q*s.prices[i];if(dir===1&&s.cash<cost||dir===-1&&s.stocks[i]<q)return note('Saldo o acciones insuficientes');s.cash-=dir*cost;s.stocks[i]+=dir*q;commit((dir===1?'Compra':'Venta')+' de acciones: '+names[i])}function turn(){s.month++;s.inflation=Math.max(0,Math.min(20,s.inflation+(Math.random()-.48)*2));s.rate=Math.max(5,s.inflation+8);let shock=Math.random()<.13;let income=s.companies.reduce((a,c)=>{let d=sectors[c.type];return a+c.level*(d.rev*(shock?.65:.85+Math.random()*.3)-d.expense*(1+s.inflation/100))},0);let interest=s.debt*s.rate/1200, savings=s.deposit*5/1200;s.deposit+=savings;s.last=income-interest+savings;s.cash+=income-interest;if(s.cash<0){s.debt-=s.cash;s.cash=0} s.prices=s.prices.map(p=>Math.max(10,p*(shock?.85:.94+Math.random()*.14)));s.history.push(total());commit((shock?'Crisis económica · ':'')+'Resultado mensual: '+money(s.last))}function render(){localStorage.setItem('cfs1',JSON.stringify(s));document.getElementById('metrics').innerHTML=[['Mes',s.month],['Efectivo',money(s.cash)],['Patrimonio estimado',money(total())],['Resultado mensual',money(s.last)],['Deuda',money(s.debt)],['Inflación / tasa anual',s.inflation.toFixed(1)+'% / '+s.rate.toFixed(1)+'%']].map(([a,b])=>'<div class="card"><small>'+a+'</small><div class="metric">'+b+'</div></div>').join('');document.getElementById('nav').innerHTML=['Empresas','Banca','Bolsa','Estados financieros','Ayuda'].map(t=>'<button class="'+(tab===t?'primary':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');let p='';if(tab==='Empresas'){p='<h2>Mercado empresarial</h2><div class="grid">'+sectors.map((c,i)=>'<div class="card"><h3>'+c.n+'</h3><p>Inversión: '+money(c.cost)+'</p><p>Ingresos base / mes: '+money(c.rev)+'</p><p>Costos base: '+money(c.expense)+'</p><button onclick="buy('+i+')">Adquirir</button></div>').join('')+'</div><h3>Mis empresas</h3>'+ (s.companies.map((c,i)=>'<div class="card">'+sectors[c.type].n+' · Nivel '+c.level+' <button onclick="upgrade('+i+')">Ampliar</button> <button onclick="sell('+i+')">Vender</button></div>').join('')||'No tienes empresas todavía')}if(tab==='Banca')p='<h2>Servicios bancarios</h2><p>Depósitos: '+money(s.deposit)+' · Rendimiento anual: 5%</p><p>Préstamos: '+money(s.debt)+' · Tasa anual: '+s.rate.toFixed(1)+'%</p><input id="amt" type="number" min="1" value="10000"> '+[['loan','Solicitar préstamo'],['pay','Abonar deuda'],['deposit','Depositar'],['withdraw','Retirar']].map(([a,b])=>'<button onclick="bank(\''+a+'\')">'+b+'</button>').join(' ');if(tab==='Bolsa')p='<h2>Mercado bursátil simulado</h2><div class="scroll"><table><tr><th>Empresa</th><th>Precio</th><th>Acciones propias</th><th>Operación</th></tr>'+names.map((n,i)=>'<tr><td>'+n+'</td><td>'+money(s.prices[i])+'</td><td>'+s.stocks[i]+'</td><td><input type="number" min="1" id="q'+i+'" value="1"> <button onclick="stock('+i+',1)">Comprar</button> <button onclick="stock('+i+',-1)">Vender</button></td></tr>').join('')+'</table></div>';if(tab==='Estados financieros')p='<h2>Balance general estimado</h2>'+[['Efectivo',s.cash],['Depósitos',s.deposit],['Empresas (valor de liquidación)',s.companies.reduce((a,c)=>a+sectors[c.type].cost*.85*c.level,0)],['Acciones',s.stocks.reduce((a,q,i)=>a+q*s.prices[i],0)],['Pasivos',s.debt],['Patrimonio',total()]].map(([a,b])=>'<p>'+a+': <strong>'+money(b)+'</strong></p>').join('');if(tab==='Ayuda')p='<h2>Cómo jugar</h2><p>Empiezas con L 500,000. Compra empresas, administra efectivo, invierte y avanza meses. Los ingresos, la inflación y el mercado fluctúan. Tu objetivo es maximizar el patrimonio sin endeudarte demasiado. La partida se guarda en este navegador. Este es un juego original inspirado en conceptos de Capitalism 9.0 y FinanceFrenzy, no una adaptación íntegra de su código.</p>';document.getElementById('panel').innerHTML=p;document.getElementById('log').innerHTML=s.log.slice(0,8).map(t=>'<p><small>'+t+'</small></p>').join('');let cv=document.getElementById('chart'),ctx=cv.getContext('2d'),h=s.history.slice(-36),lo=Math.min(0,...h),hi=Math.max(1,...h);ctx.clearRect(0,0,900,160);ctx.strokeStyle='#80e5c5';ctx.lineWidth=3;ctx.beginPath();h.forEach((v,i)=>{let x=15+i*870/Math.max(1,h.length-1),y=145-(v-lo)/(hi-lo)*130;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}render();
</script></html>
